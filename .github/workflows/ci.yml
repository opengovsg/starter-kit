name: CI

on:
  pull_request:
    branches: ['*']
    types: [opened, reopened, synchronize]
  push:
    branches: ['main']
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint && pnpm lint:ws

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Typecheck
        run: pnpm typecheck

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      # Check ECDSA registry signatures on every installed package. Fails when a
      # package is unsigned and its registry advertises signing keys. Clean today.
      - name: Verify registry signatures
        run: pnpm audit signatures

      # Produce an SBOM each run so a registry compromise can be scoped later.
      # Answers "were we exposed, and in which build?" without lockfile archaeology.
      - name: Generate SBOM
        run: pnpm sbom --sbom-format cyclonedx --prod --out sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Configure Datadog Test Visibility
        env:
          DD_SERVICE_NAME: ${{ secrets.DD_SERVICE_NAME }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        if: env.DD_SERVICE_NAME != '' && env.DD_API_KEY != ''
        uses: datadog/test-visibility-github-action@d7e3562370d3742851764531da3cb54a743ebd63
        with:
          languages: js
          service: ${{ secrets.DD_SERVICE_NAME }}
          api_key: ${{ secrets.DD_API_KEY }}
          # Keep in sync with the dd-trace version in pnpm-workspace.yaml catalog
          js-tracer-version: 6.1.0
      - name: Run tests
        run: pnpm test:ci
        env:
          # Required to allow Datadog to trace Vitest tests
          NODE_OPTIONS: ${{ secrets.DD_API_KEY && secrets.DD_SERVICE_NAME && format('-r {0} --import {1}', env.DD_TRACE_PACKAGE, env.DD_TRACE_ESM_IMPORT) || '' }}
          # Tag test runs so they group with the rest of our Datadog data
          # (DD_SERVICE is exported by the Configure step's `service` input).
          DD_ENV: ci

      - name: Upload coverage to Datadog
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        if: env.DD_API_KEY != ''
        # DataDog/coverage-upload-github-action@v1.0.5, using commit hash to pin to silence codeQL
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          files: apps/web/coverage packages/logging/coverage

  e2e:
    runs-on: ubuntu-24.04 # ponytail: Playwright 1.57 has no deps for 26.04; back to latest after bumping Playwright
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-

      - name: Install Playwright (Chromium)
        run: pnpm --filter @acme/web exec playwright install --with-deps chromium

      # Playwright serves this build via `next start` when CI is set
      # (see webServer in apps/web/playwright.config.ts).
      - name: Build app
        run: pnpm --filter @acme/web build-e2e

      # Containers are started by the Playwright globalSetup (testcontainers).
      - name: Run Playwright tests
        run: pnpm --filter @acme/web e2e

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Unique per run attempt so re-runs don't collide.
          name: e2e-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/tests/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
