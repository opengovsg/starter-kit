name: 'Setup and install'
description: 'Common setup steps for Actions'

inputs:
  job-index:
    description: "Index of the current job within its matrix, if any. Composite actions can't read the caller's strategy context directly, so matrixed callers must pass it in explicitly to disambiguate their turbo cache key."
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        # pnpm 12's npm package ships a placeholder bin/pnpm shell script that
        # fails under /bin/sh. Force the standalone @pnpm/exe binary instead.
        standalone: true
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: 'package.json'

    # setup-node cache: pnpm only restores the content store. The age/trust
    # memo is lockfile-verified.jsonl in cacheDir, so cache both on the lockfile.
    - name: Get pnpm cache paths
      id: pnpm-cache
      shell: bash
      run: |
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "verified=$(pnpm cache path)/lockfile-verified.jsonl" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store and lockfile verification
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.pnpm-cache.outputs.store }}
          ${{ steps.pnpm-cache.outputs.verified }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Cache turbo build setup
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        # inputs.job-index disambiguates matrix legs sharing the same github.job (e.g. concurrent vitest shards),
        # which would otherwise race to reserve the same cache key. Defaults to 0 on non-matrix
        # jobs, so the key there is unaffected.
        key: ${{ runner.os }}-turbo-${{ github.job }}-${{ inputs.job-index }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.job }}-${{ inputs.job-index }}-

    # --frozen-lockfile is already implied on detected CI, but state it explicitly:
    # this composite action is reused from several workflows, and an install that
    # silently rewrites the lockfile would defeat the point of committing one.
    - shell: bash
      run: pnpm install --frozen-lockfile
